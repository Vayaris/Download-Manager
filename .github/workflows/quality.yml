name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend tests
      - run: node --check frontend/static/js/app.js
      - run: node --check frontend/static/js/settings.js
      - run: node --check frontend/static/js/plex.js
      - run: node --test tests/frontend_workspace.test.js
      - run: bash -n install.sh
      - run: bash -n start.sh
